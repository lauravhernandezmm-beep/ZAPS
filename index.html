<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#416ff0">
  <title>ZAPS · Tu universo sneaker</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <section id="authScreen" class="auth-screen" aria-label="Acceso a ZAPS">
    <div class="auth-art"><img src="assets/zaps-logo.png" alt="ZAPS"><h1>Tu universo sneaker,<br>en un solo lugar.</h1><p>Descubre modelos únicos, guarda favoritos y organiza tu colección.</p></div>
    <div class="auth-panel">
      <div class="auth-card">
        <div id="authWelcome" class="auth-welcome">
          <img class="auth-welcome-logo" src="assets/zaps-logo.png" alt="ZAPS">
          <div class="welcome-actions">
            <button class="button welcome-primary" type="button" data-auth-go="login">Iniciar sesión</button>
            <button class="button secondary" type="button" data-auth-go="register">Registrarse</button>
            <button class="forgot-link" type="button" data-auth-go="recover">¿Has olvidado tu contraseña?</button>
          </div>
        </div>
        <div id="authContent" hidden>
          <button class="auth-back" type="button" data-auth-go="welcome" aria-label="Volver">← Volver</button>
          <img class="auth-form-logo" src="assets/zaps-logo.png" alt="ZAPS">
          <h2 id="authHeading">Iniciar sesión</h2>
          <p class="auth-caption" id="authCaption">Accede a tu colección personal.</p>
          <form id="authForm" novalidate>
            <div class="auth-name hidden" id="authNameWrap"><label for="authName">Nombre de usuario</label><input id="authName" name="name" autocomplete="nickname" placeholder="Ej. Lau" maxlength="40"></div>
            <label for="authEmail">Correo electrónico</label><input id="authEmail" name="email" type="email" autocomplete="email" placeholder="tu@email.com" required>
            <div id="authPasswordWrap"><label for="authPassword">Contraseña</label><input id="authPassword" name="password" type="password" autocomplete="current-password" placeholder="Mínimo 8 caracteres" minlength="8"></div>
            <div id="authRecoveryCodeWrap" hidden><label for="authRecoveryCode">Código recibido por correo</label><input id="authRecoveryCode" name="recoveryCode" inputmode="numeric" autocomplete="one-time-code" placeholder="Introduce el código del email"></div>
            <div id="authNewPasswordWrap" hidden><label for="authNewPassword">Nueva contraseña</label><input id="authNewPassword" name="newPassword" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" minlength="8"></div>
            <p id="authError" class="auth-error" role="alert" hidden></p>
            <p id="authInfo" class="auth-info" role="status" hidden></p>
            <button type="submit" class="button auth-submit" id="authSubmit">Iniciar sesión</button>
          </form>
          <button class="forgot-link auth-alt" id="authForgotLink" type="button" data-auth-go="recover">¿Has olvidado tu contraseña?</button>
          <p class="auth-note" id="authNote">Demo local: los usuarios se guardan solo en este navegador.</p>
        </div>
      </div>
    </div>
  </section>
  <div class="app-shell" id="appShell" hidden>
    <aside class="desktop-sidebar" aria-label="Navegación lateral">
      <a class="brand desktop-brand" href="#dashboard"><img src="assets/zaps-logo.png" alt="ZAPS"></a>
      <nav id="desktopNav"></nav>
      <p class="sidebar-note">Tu universo sneaker,<br>en un solo lugar.</p>
    </aside>
    <div class="app-body">
      <header class="topbar">
        <a class="brand" href="#dashboard" aria-label="ZAPS, ir al Dashboard"><img src="assets/zaps-logo.png" alt="ZAPS"></a>
        <button class="icon-btn profile-trigger" data-route="profile" aria-label="Ver perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
      </header>
      <main id="app" tabindex="-1"></main>
      <nav class="bottom-nav" id="bottomNav" aria-label="Navegación principal"></nav>
    </div>
  </div>
  <div id="modalRoot"></div>
  <div class="toast-region" id="toastRoot" aria-live="polite"></div>
</body>
</html>
